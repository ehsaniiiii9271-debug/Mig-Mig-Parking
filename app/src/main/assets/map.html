<!DOCTYPE html>
<html>
<head>
    <title>Mig Mig Parking Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { padding: 0; margin: 0; }
        html, body, #map { height: 100%; width: 100vw; }
        .leaflet-control-attribution { display: none !important; }
        .leaflet-control-zoom { display: none !important; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([51.505, -0.09], 13);
        var marker;

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        }).addTo(map);

        map.on('click', function(e) {
            if (marker) {
                map.removeLayer(marker);
            }
            marker = L.marker(e.latlng).addTo(map);
            if (window.Android) {
                window.Android.onMapClick(e.latlng.lat, e.latlng.lng);
            }
        });

        function setCenter(lat, lng) {
            map.setView([lat, lng], 16);
            if (marker) map.removeLayer(marker);
            marker = L.marker([lat, lng]).addTo(map);
        }

        function addParkingMarker(lat, lng, id) {
             L.marker([lat, lng], {icon: L.divIcon({className: 'parking-icon', html: 'P'})}).addTo(map)
                .on('click', function() {
                    if (window.Android) window.Android.onParkingClick(id);
                });
        }
    </script>
</body>
</html>
